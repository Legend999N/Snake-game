[project]
name = "serpent-snake-game"
version = "1.0.0"
description = "A modern, feature-rich Snake game built with Pygame"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nishchay Sharma"},
]
keywords = ["snake", "game", "pygame", "arcade"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/nishchaysharma/serpent-snake-game"
Repository = "https://github.com/nishchaysharma/serpent-snake-game.git"
Issues = "https://github.com/nishchaysharma/serpent-snake-game/issues"

[project.scripts]
serpent = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
